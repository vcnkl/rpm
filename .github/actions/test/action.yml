name: Test
description: Set up Go, then format-check, vet, and race-test the module

inputs:
  skip-integration:
    description: Set to "true" to skip integration tests
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Check formatting
      shell: bash
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "The following files are not formatted with gofmt:"
          echo "$unformatted"
          exit 1
        fi

    - name: Vet
      shell: bash
      run: go vet ./...

    - name: Test
      shell: bash
      run: go test -race ./...
      env:
        SKIP_INTEGRATION: ${{ inputs.skip-integration }}
