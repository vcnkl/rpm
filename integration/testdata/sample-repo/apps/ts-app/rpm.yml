name: ts-app

env:
  variables:
    TS_VAR: "typescript_value"
  deps:
    - mailhog

targets:
  - name: app_build
    in:
      - "src/**/*.ts"
    out:
      - dist/index.js
    cmd: npx tsc
    config:
      working_dir: local

  - name: web
    deps:
      - ":app_build"
    cmd: echo "REPO_ROOT=$REPO_ROOT BUNDLE_ROOT=$BUNDLE_ROOT TS_VAR=$TS_VAR"
    config:
      dotenv:
        enabled: false
      reload: true
