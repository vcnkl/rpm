name: go-app

env:
  variables:
    GO_VAR: "go_value"
    APP_PORT: "8080"
  dependencies:
    - name: postgres
      image: postgres:16
      mode: shared
      env:
        POSTGRES_PASSWORD: example
      ports:
        - "5432"
      volumes:
        - postgres-data:/var/lib/postgresql/data

targets:
  - name: app_build
    in:
      - "*.go"
    out:
      - bin/app
    cmd: go build -o bin/app .
    env:
      BUILD_MODE: "release"
    config:
      working_dir: local

  - name: prepare
    cmd: echo "BEFORE_TARGET=$BUNDLE_ROOT"
    config:
      working_dir: local

  - name: before_file
    cmd: . "$BUNDLE_ROOT/scripts/before.sh"
    config:
      working_dir: local

  - name: before_inline
    cmd: echo "BEFORE_INLINE=$REPO_ROOT"
    config:
      working_dir: repo_root

  - name: echo-123
    deps:
      - ":app_build"
    cmd: echo "REPO_ROOT=$REPO_ROOT BUNDLE_ROOT=$BUNDLE_ROOT GO_VAR=$GO_VAR APP_PORT=$APP_PORT BUILD_MODE=$BUILD_MODE GLOBAL_VAR=$GLOBAL_VAR"
    config:
      dotenv:
        enabled: true
      reload: true
      ignore:
        - "bin/**"

  - name: app_test
    cmd: go test ./...
    config:
      working_dir: local
