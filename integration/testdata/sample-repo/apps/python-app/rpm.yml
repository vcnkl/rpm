name: python-app

env:
  variables:
    PYTHON_VAR: "python_value"
  deps:
    - redis

targets:
  - name: echo-456
    cmd: echo "REPO_ROOT=$REPO_ROOT BUNDLE_ROOT=$BUNDLE_ROOT PYTHON_VAR=$PYTHON_VAR"
    config:
      dotenv:
        enabled: true
      reload: false

  - name: app_test
    cmd: python -m pytest tests/
    config:
      working_dir: local
