name: python-app

env:
  PYTHON_VAR: "python_value"

dependencies:
  - name: redis
    image: redis:7
    mode: dedicated
    ports:
      - "6379:6379"

targets:
  - name: run
    cmd: echo "REPO_ROOT=$REPO_ROOT BUNDLE_ROOT=$BUNDLE_ROOT PYTHON_VAR=$PYTHON_VAR"
    config:
      dotenv:
        enabled: true
      reload: false

  - name: app_test
    cmd: python -m pytest tests/
    config:
      working_dir: local
