version: 1
name: local-stack
live_reload:
    enabled: true
    debounce: 100ms
before:
    - go-app:prepare
    - go-app:before_file
    - go-app:before_inline
targets:
    - ref: go-app:echo-123
      reload: true
      env:
        APP_PORT: "8080"
    - ref: ts-app:web
      reload: true
    - ref: python-app:echo-456
      reload: false
dependencies:
    enabled: true
    include:
        - mailhog
        - postgres
        - redis
    exclude: []
variables:
    LOG_LEVEL: debug
