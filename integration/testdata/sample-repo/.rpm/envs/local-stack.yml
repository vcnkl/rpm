version: 1
name: local-stack
live_reload:
    enabled: true
    debounce: 100ms
pre:
    - go-app:prepare
    - go-app:scripts/pre.sh
    - |
      echo "PRE_INLINE=$REPO_ROOT"
targets:
    - ref: go-app:run
      reload: true
      env:
        APP_PORT: "8080"
    - ref: ts-app:web
      reload: true
    - ref: python-app:run
      reload: false
dependencies:
    enabled: true
    include:
        - go-app:postgres
        - python-app:redis
        - ts-app:mailhog
    exclude: []
variables:
    LOG_LEVEL: debug
